# Configuração do Supabase CLI para desenvolvimento local (`supabase start`).
# Projetos remotos (homologação/produção) são configurados no painel.
project_id = "one-control"

[api]
enabled = true
port = 54321
schemas = ["public"]          # o schema private NÃO é exposto pela Data API
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false          # sem cadastro público
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"
